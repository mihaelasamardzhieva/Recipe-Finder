[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # The Spoonacular key is bundled into the client-side JavaScript by design.
  # Without this line Netlify's secrets scan would find it in the build
  # output and refuse to publish the site.
  SECRETS_SCAN_OMIT_KEYS = "SPOONACULAR_API_KEY"